[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-intelligence"
version = "2.0.0"
description = "Motorsport Strategy Decision Engine and Race Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akash Patil" }]
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.14.0,<1.15.0",
    "scikit-learn>=1.3.0",
    "plotly>=5.18.0",
    "fastf1>=3.3.0",
    "matplotlib>=3.7.0",
    "requests>=2.28.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C408",  # unnecessary dict call (standard Plotly API pattern)
    "B905",  # zip() without explicit strict= parameter
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]
